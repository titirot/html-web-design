<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דף הבית</title>
    <link href="style.css" rel="stylesheet" >
</head>
<style>
    body {
        margin: 0;
        overflow: hidden; /* מבטל גלילה */
        background-color: rgb(216, 23, 132);
        /* align-items: center;
        justify-content: center; */
    }
    video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        object-fit: cover; /* מכסה את המסך בצורה פרופורציונלית */
        z-index: -1; /* שומר על הווידאו מאחורי התוכן */
    }

    .home {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 1; /* מעל הווידאו */
        }
        .home h1 {
            font-size: 3rem;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            margin: 0;
        }
        @media (max-width: 768px) {
            .home h1 {
                font-size: 2rem; /* התאמת הגודל למסכים קטנים */
            }
        }
</style>


<body class="hide-scroll">
    
        <div class="home">
            <video source src="images/עיצוב סרטון חדר כושר.mp4" muted loop autoplay width="100%" height="100%"></video>
            </div>

    
</body>
</html>
